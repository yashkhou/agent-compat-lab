name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run sarif
      - name: Validate SARIF
        run: node -e "const s=JSON.parse(require('fs').readFileSync('agent-compat.sarif','utf8')); if(s.version!=='2.1.0') process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-compat-sarif
          path: agent-compat.sarif
